# SignalSDRPro reference clock hardware, read by /etc/init.d/S22refclk and
# by api_controller.sh. Plain shell assignments.
#
# The 40 MHz VC-TCXO is tuned through a mux by one of two sources: the
# charge pump of an ADF4001 PLL locked to the 10 MHz input J13, which the
# FPGA programs and supervises exactly as on the PlutoSky R2 (ADF4001_refctl
# in the bitstream, same EMIO lines), or a DAC8531 driven by the vctcxo_lock
# IP (vcxoctrl@43c00000 in the device tree) disciplined to the GNSS 1PPS,
# the PPS input J11 or the same 10 MHz. The FPGA selects the PLL whenever
# its loop is closed and the DAC otherwise; the mux lines below override
# that for tests. State is on EMIO GPIO lines of the zynq_gpio chip,
# offset REFCLK_EMIO_BASE + n.
REFCLK_HW=adf4001
REFCLK_CHIP_LABEL=zynq_gpio
REFCLK_EMIO_BASE=54
REFCLK_O_FORCE_EXT=32      # out: 1 = PLL loop always closed
REFCLK_O_FORCE_INT=34      # out: 1 = PLL loop always open (neither: automatic)
REFCLK_I_PRESENT=33        # in : 10 MHz reference detected
REFCLK_I_CP=35             # in : charge pump active
REFCLK_I_COUNT=36          # in : 16 lines, R divider edges per 102.4 us window
REFCLK_I_LOCK=52           # in : PLL locked (ADF4001 digital lock detect)
REFCLK_I_STATE=53          # in : 2 lines, 0 absent 1 acquire 2 locked 3 recheck
REFCLK_O_MUX_FORCE=55      # out: 1 = drive the tune mux from REFCLK_O_MUX_VAL
REFCLK_O_MUX_VAL=56        # out: 1 = DAC8531 steers the oscillator, 0 = ADF4001
REFCLK_I_MUX=57            # in : tune mux select as driven (1 = DAC, 0 = ADF4001)
REFCLK_NOMINAL_HZ=10000000
REFCLK_COUNT_EXPECTED=1024
