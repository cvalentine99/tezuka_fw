server saturne.obs-besancon.fr iburst minpoll 4
server 0.fr.pool.ntp.org iburst minpoll 4
server 1.fr.pool.ntp.org iburst minpoll 4
server 2.fr.pool.ntp.org iburst minpoll 4
server 3.fr.pool.ntp.org iburst minpoll 4

# NTP via GPS
# gpsd creates NTP SHM units 0 and 1 root-only (mode 600), so chronyd has to
# keep root to read them; as user chrony both refclocks stay at zero samples.
user root
refclock SHM 0 refid NMEA offset 0.000 precision 1e-3 poll 3
# PPS: gpsd (built with pps-tools, so it has kernel PPS support) reads the
# GNSS 1PPS from /dev/pps0 on boards whose device tree provides one and
# timestamps each pulse with the second taken from the NMEA fix. It hands the
# result to chronyd over this socket, which chronyd creates and gpsd looks for
# when it opens the device (so chronyd must start before gpsd: S49 before S50).
# The name is chrony.<device basename>.sock. Boards without /dev/pps0 just
# never get a sample here, which is harmless.
refclock SOCK /run/chrony.pps0.sock refid PPS precision 1e-7 prefer
makestep 1 -1



# Serve NTP to the network. chrony answers on UDP 123 only once it is itself
# synchronised (upstream servers over IP, or the GPS refclock above), so an
# unsynced board refuses clients rather than serving wrong time - which is why
# ntpd, which answered LI=3 stratum-0 from a sourceless config, is gone.
allow
