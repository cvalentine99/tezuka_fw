[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tezuka-mcp"
version = "0.1.0"
description = "Host-side read-only MCP server for a Tezuka SDR sensor (classifier snapshot, FPGA waterfall snapshot)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "paho-mqtt>=2.0,<3",
    "websockets>=12",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tezuka-mcp = "tezuka_mcp.server:main"

[tool.setuptools.packages.find]
include = ["tezuka_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
